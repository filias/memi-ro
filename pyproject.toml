[project]
name = "memi-romania"
version = "0.1.0"
description = "Memi Romania - practise your memory of Romania"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22",
    "memi-engine>=0.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memi_ro"]
